name: sundownAnnouncementManager
version: '${version}'
prefix: Announcement Manager

main: org.chonkleblorp.sundownAnnouncementManager.SundownAnnouncementManager
description: A plugin for managing announcements on Sundown SMP
author: chonkleblorp (Dominic Gena)
website: https://sundown.social/

api-version: '26.1.2'
load: POSTWORLD

permissions:
  op.node:
    description: "Can send announcements"
    default: op

  default.node:
    description: "The player; receives announcements sent by the op(s)"
    default: true